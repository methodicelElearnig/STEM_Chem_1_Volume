<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדידת נפח באמצעות דחיקת מים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1D4ED8;
    --primary-hover: #1E3A8A;
    --bg-page: #0F172A; 
    --card-bg: #FAF3E0; 
    --text-main: #1E293B;
    --text-muted: #475569;
    --done-bg: #E0E7FF;
    --done-border: #93C5FD;
    --done-text: #1E40AF;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Rubik', sans-serif;
    color: var(--text-main);
    background: var(--bg-page);
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
    min-height: 100vh;
  }
  
  .app {
    max-width: 880px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.8);
    border: 1px solid #475569;
  }
  
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  
  .header h2 { margin: 0; color: var(--primary); font-size: 28px; font-weight: 700; text-shadow: 1px 1px 0px rgba(255,255,255,0.5); }
  .header p { margin: 10px 0 0 0; color: var(--text-muted); font-size: 16px; }
  
  .wrap {
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  
  .stage {
    border-radius: 20px;
    padding: 20px;
    flex: 0 0 auto;
    background: #FFFFFF;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    border: 3px solid #E2E8F0;
    margin: 0 auto;
    position: relative;
  }
  
  .panel {
    flex: 1;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  
  .pick {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    padding: 16px;
    border: 2px solid #CBD5E1;
    background: #FFFFFF;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: all 0.25s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  
  .pick:hover:not(:disabled) {
    background: #F1F5F9;
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(29, 78, 216, 0.15);
  }
  
  .pick:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #E2E8F0;
    border-color: #CBD5E1;
  }
  
  .pick.done {
    background: var(--done-bg);
    border-color: var(--done-border);
    cursor: default;
    transform: none;
    box-shadow: none;
  }
  
  .pick .lbl {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
  }
  
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: #FFFFFF;
    border: 2px solid #CBD5E1;
    border-radius: 16px;
    overflow: hidden;
    font-size: 15px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.05);
    margin-top: 10px;
  }
  
  .data-table th, .data-table td {
    padding: 14px 16px;
    text-align: right;
    border-bottom: 1px solid #E2E8F0;
  }
  
  .data-table th {
    background: #F1F5F9;
    font-weight: 700;
    color: var(--text-muted);
    font-size: 14px;
  }
  
  .data-table tr:last-child td { border-bottom: none; }
  
  .data-table .final-row {
    background: var(--done-bg);
    font-weight: 700;
    color: var(--done-text);
    font-size: 16px;
  }
  
  .empty-cell {
    color: #94A3B8;
    font-style: italic;
    font-size: 13.5px;
  }
  
  .ltr-math {
    direction: ltr;
    display: inline-block;
    font-family: monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--primary);
  }
  
  .reset {
    align-self: flex-start;
    font-family: inherit;
    font-size: 15px;
    padding: 14px 28px;
    border: none;
    background: var(--text-main);
    color: white;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    margin-top: 10px;
  }
  
  .reset:hover { 
    background: #000000; 
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h2>מדידת נפח באמצעות דחיקת מים</h2>
    <p>הכניסו את דגימת הסלע למשורה ועקבו אחר השינוי בנפח המים.</p>
  </div>
  <div class="wrap">
    <div class="stage">
      <svg id="svg" width="300" height="430" viewBox="0 0 300 430">
        <defs>
          <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="15%" stop-color="#ffffff" stop-opacity="0.2"/>
            <stop offset="85%" stop-color="#ffffff" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
          </linearGradient>
          <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.75"/>
            <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="waterTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9"/>
          </linearGradient>

          <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="4" flood-opacity="0.35"/>
          </filter>
        </defs>
        <g id="scene"></g>
      </svg>
    </div>
    
    <div class="panel">
      <div id="picks"></div>
      <div id="table-container"></div>
      <button class="reset" id="reset">↺ רוקן משורה והתחל מחדש</button>
    </div>
  </div>
</div>

<script>
var SVG='http://www.w3.org/2000/svg';
var scene = document.getElementById('scene'), 
    picksEl = document.getElementById('picks'),
    tableContainer = document.getElementById('table-container');

var BASE = 80, CAP = 140;
var ROCK_VOL = 40; 

var isInserted = false;
var curWater = BASE;
var busy = false;
// משורה צרה: 75 פיקסלים
var cx = 150, w = 75, topY = 30, botY = 400, h = botY - topY;
var rockY = 80; 

function yFor(v){ return botY - (v/CAP)*h; }
function E(t,a,x){ var e=document.createElementNS(SVG,t); for(var k in a) e.setAttribute(k,a[k]); if(x!=null) e.textContent=x; return e; }
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

function getRockSVG() {
  var rg = E('g', {});
  
  rg.appendChild(E('polygon', {
    points: '-42,20 -48,0 -28,-18 -8,-38 12,-22 35,-12 45,15 28,28 -12,25',
    fill: '#9CA3AF',
    stroke: '#374151',
    'stroke-width': 1.5
  }));

  rg.appendChild(E('polygon', {
    points: '-42,20 -48,0 -28,-18 -8,-38 2,-10 -5,12 -22,22',
    fill: '#F3F4F6',
    opacity: 0.95
  }));

  rg.appendChild(E('polygon', {
    points: '-8,-38 12,-22 35,-12 45,15 28,28 8,18 2,-10',
    fill: '#6B7280',
    opacity: 0.9
  }));

  rg.appendChild(E('polygon', {
    points: '-42,20 -22,22 -5,12 8,18 28,28 45,15 38,25 10,30 -20,26',
    fill: '#374151',
    opacity: 0.95
  }));

  var lines = [
    'M -28,-18 L -15, -2 L -5, 12',
    'M -8,-38 L -2,-10 L 8,18',
    'M 12,-22 L 20, -5 L 28,28',
    'M -2, -10 L 15, 2',
    'M -15, -2 L -35, 10'
  ];
  lines.forEach(function(d) {
    rg.appendChild(E('path', {d: d, stroke: '#4B5563', 'stroke-width': 1, fill: 'none'}));
  });
  
  var speckles = [
    {x:-30,y:10,r:1}, {x:-20,y:-5,r:1.5}, {x:-10,y:-20,r:1}, {x:5,y:5,r:1.5},
    {x:20,y:-10,r:1}, {x:30,y:15,r:1.5}, {x:0,y:20,r:1}, {x:15,y:22,r:1}
  ];
  speckles.forEach(function(sp) {
    rg.appendChild(E('circle', {cx: sp.x, cy: sp.y, r: sp.r, fill: '#374151', opacity: 0.5}));
  });
  
  return rg;
}

function draw(){
  clear(scene);
  
  scene.appendChild(E('rect', {x:cx-w/2, y:topY, width:w, height:h, rx:12, fill:'#F8FAFC', stroke:'#CBD5E1', 'stroke-width':2}));
  
  for(var v=0; v<=CAP; v+=10){
    var y = yFor(v), maj = (v%20===0);
    scene.appendChild(E('line', {x1:cx-w/2, y1:y, x2:cx-w/2+(maj?16:8), y2:y, stroke:maj?'#64748B':'#CBD5E1', 'stroke-width':maj?2:1}));
    if(maj) scene.appendChild(E('text', {x:cx-w/2-8, y:y+4, 'font-size':14, 'font-weight':700, fill:'#475569', 'text-anchor':'end', 'style':'direction:ltr'}, v));
  }
  
  var wy = yFor(curWater);
  var ry = 7;
  var waterHeight = botY - wy;
  if(waterHeight > 0) {
    scene.appendChild(E('rect', {x:cx-w/2+2, y:wy, width:w-4, height:waterHeight-2, fill:'url(#waterGrad)', rx:4}));
    scene.appendChild(E('ellipse', {cx:cx, cy:wy, rx:(w-4)/2, ry:ry, fill:'url(#waterTopGrad)'}));
  }
  
  if(isInserted || busy) {
    var rg = getRockSVG();
    // הקטנת הסלע ב-45% כדי שיתאים בדיוק למשורה הצרה (רוחב 75)
    rg.setAttribute('transform', 'translate(' + cx + ',' + rockY + ') scale(0.55)');
    rg.setAttribute('filter', 'url(#dropShadow)');
    scene.appendChild(rg);
  }
  
  scene.appendChild(E('line', {x1:cx+w/2, y1:wy, x2:cx+w/2+30, y2:wy, stroke:'#EF4444', 'stroke-width':1.5, 'stroke-dasharray':'4 3'}));
  scene.appendChild(E('text', {x:cx+w/2+35, y:wy+4, 'font-size':13, 'font-weight':700, fill:'#EF4444', 'style':'direction:ltr'}, Math.round(curWater)));

  scene.appendChild(E('rect', {x:cx-w/2, y:topY, width:w, height:h, rx:12, fill:'url(#glassGrad)', 'pointer-events':'none'}));
}

function insertRock(){
  if(busy || isInserted) return;
  isInserted = true;
  curWater = BASE; 
  rockY = 60; 
  
  renderUI(); 
  
  var targetWater = BASE + ROCK_VOL;
  var targetRockY = botY - 22; 
  
  busy = true; 
  var startWater = curWater, startRockY = rockY, t0 = null, dur = 1400;
  
  function fr(ts){ 
    if(!t0) t0 = ts; 
    var p = Math.min(1, (ts-t0)/dur); 
    var ease = 1 - Math.pow(1 - p, 3); 
    
    curWater = startWater + (targetWater - startWater) * ease; 
    rockY = startRockY + (targetRockY - startRockY) * ease;
    
    draw();
    if(p < 1) requestAnimationFrame(fr); else { busy = false; renderUI(); } 
  }
  requestAnimationFrame(fr);
}

function renderUI(){
  draw();
  picksEl.innerHTML = '';
  
  var b = document.createElement('button');
  b.className = 'pick' + (isInserted ? ' done' : '');
  if(isInserted) b.disabled = true;
  
  var iconSvg = '<svg width="70" height="70" viewBox="-50 -50 100 100">' + getRockSVG().innerHTML + '</svg>';
  
  b.innerHTML = iconSvg + '<span class="lbl">' + (isInserted ? 'הדגימה בפנים ✓' : 'הכניסו את דגימת הסלע') + '</span>';
  b.onclick = insertRock;
  picksEl.appendChild(b);
  
  var t = '<table class="data-table">';
  t += '<thead><tr><th>שלב בניסוי</th><th>חישוב</th><th>נפח במ"ל</th></tr></thead><tbody>';
  
  t += '<tr><td>נפח מים התחלתי</td><td class="empty-cell">קריאה ישירה</td><td>' + BASE + '</td></tr>';
  
  if(isInserted) {
    var v2 = BASE + ROCK_VOL;
    t += '<tr><td>מפלס מים לאחר הוספת הסלע</td><td class="empty-cell">קריאה ישירה</td><td>' + v2 + '</td></tr>';
    t += '<tr class="final-row"><td>נפח דגימת הסלע</td><td><span class="ltr-math">' + v2 + ' - ' + BASE + '</span></td><td>' + ROCK_VOL + ' מ"ל</td></tr>';
  } else {
    t += '<tr><td>מפלס מים לאחר הוספת הסלע</td><td class="empty-cell">-</td><td class="empty-cell">ממתין לדגימה</td></tr>';
    t += '<tr class="final-row"><td>נפח דגימת הסלע</td><td class="empty-cell">-</td><td class="empty-cell">-</td></tr>';
  }
  
  t += '</tbody></table>';
  tableContainer.innerHTML = t;
}

document.getElementById('reset').onclick = function() {
  if(busy) return;
  isInserted = false;
  curWater = BASE;
  renderUI();
};

renderUI();
</script>
</body>
</html>
